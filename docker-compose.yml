version: "3.9"

# ProjectPulse — Docker Compose
# Runs the full stack (frontend + backend API) in a single service.
# For a multi-service architecture see the comments below.

services:
  projectpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectpulse
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

